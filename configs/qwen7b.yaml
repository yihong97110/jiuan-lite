# Qwen2.5-7B-Instruct 训推配置（GPU 服务器版，需显存 >= 24GB，如 RTX 3090/A100）
# API Key 一律走环境变量/.env（前端「设置·API Key」页可配），此处不留明文。
chat:
  # -- 双后端路由（langchain_agent._get_llm 按 model_id 自动切换）--
  # 默认（前端选"DeepSeek 默认"，不传 model_id）：云端 DeepSeek，function calling 强、
  # 不占本地 GPU -- 训练工具可安全停掉本地 vLLM 释放显存而不中断对话。
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  # 选择已训练模型时：本地 vLLM（LoRA + hermes function calling）
  vllm_base_url: http://127.0.0.1:8001/v1
  vllm_model: gaokao7b-v3-20260823-223535   # 与 vllm serve --lora-modules 名对齐（= model_id）
  system_prompt: ""   # 留空用代码里的 DEFAULT_SYSTEM_PROMPT（平台训练助手：含训练咨询->确认->执行流程）
  memory_window: 10
  temperature: 0.7
  max_tokens: 1024

infer:
  backend: vllm             # 服务器评测/Agent 走 vLLM(8001)；GPU 已被 vLLM 占用，勿用 transformers 直载 7B
  device: cuda
  precision: bf16           # 7B 用 bf16（24GB 卡不开量化可跑推理）
  max_new_tokens: 512
  do_sample: false          # greedy，输出稳定

eval:
  max_samples: 20
  use_judge: auto           # auto | true | false

judge:
  # -- DeepSeek 官方 API（LLM-as-Judge 裁判）--
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  api_key: ${DEEPSEEK_API_KEY}   # 从环境变量读取，勿硬编码
  api_key_env: DEEPSEEK_API_KEY
  probe: true               # 支持 /models 探测
  require_key: true         # 无 key 自动回退 ROUGE/BLEU
  timeout: 60
  max_retries: 4

model:
  name: Qwen/Qwen2.5-7B-Instruct
  local_dir: /root/autodl-tmp/models/qwen2.5-7b-instruct   # 服务器本地权重目录

train:
  backend: hf               # 7B 实测走 hf(peft)；llamafactory 亦可
  device: cuda
  precision: bf16
  method: lora
  epochs: 3
  lr: 0.0002
  batch_size: 2
  grad_accum: 8             # 有效批 = 2*8 = 16
  max_seq_len: 1024
  gradient_checkpointing: true   # 7B 必开，省显存约 40%
  save_steps: 50
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]

rag:
  embedder: bge             # bge(LangChain 混合检索) | tfidf(离线兜底)
  top_k: 5
